name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The advertised minimum (package.json engines) and the latest 24.x.
        node: ["24.2.0", "24"]
    steps:
      # Actions are pinned by commit SHA, not tag: tags are mutable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm invariants
      - run: pnpm test
      # Its own step with a hard timeout: a catastrophic regex hangs the process.
      - run: pnpm redos
        timeout-minutes: 2
      # Full report in the log; regressions already fail the test step above.
      - run: pnpm eval --plain
      - run: pnpm build
      # Smoke: the built CLI must answer. Silent output with exit 0 is a fail-open.
      - run: node dist/cli.js --version | grep -q .
      # croak-install plans without running any lifecycle script (security model §5).
      - run: sh scripts/test-croak-install.sh
      # croak must keep working sandboxed (D23): no spawning, writing, workers, or eval.
      - run: >-
          node --permission --allow-fs-read="$PWD" --disallow-code-generation-from-strings
          dist/cli.js repo eval/cases/d-known-tool-chained/fixture --json | grep -q '"verdict": "block"'
