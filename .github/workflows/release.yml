name: Release

# Publishes @vola-trebla/croak to npm when a version tag is pushed (D49, D50).
# npm trusted publishing: npm trusts this workflow file in this repository
# through a short-lived OIDC token, so no npm token is stored anywhere, and
# npm attaches provenance that croak itself can verify (M7).
on:
  push:
    tags: ["v*"]

# Least privilege by default; only the publish job may mint an OIDC token.
permissions:
  contents: read

# One release at a time; a second tag waits instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything that runs dev dependencies runs here, where no OIDC token can
  # be requested: a compromised dev tool cannot publish croak (M8 review).
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA, not tag: tags are mutable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache in a release: a poisoned cache entry would end up
      # in the package.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: The tag names the version in package.json
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME, package.json $version"; exit 1; }
      - run: pnpm install --frozen-lockfile
      # The same gates as CI, on the exact commit that is published.
      - run: pnpm check
      - run: pnpm redos
        timeout-minutes: 2
      - run: pnpm eval --plain
      - run: pnpm build
      - run: node dist/cli.js --version | grep -q .
      - run: sh scripts/test-croak-install.sh
      - run: sh scripts/test-croak-hook.sh
      - run: sh scripts/test-tarball.sh
      # croak must keep working sandboxed (D23).
      - run: >-
          node --permission --allow-fs-read="$PWD" --disallow-code-generation-from-strings
          dist/cli.js repo eval/cases/d-known-tool-chained/fixture --json | grep -q '"verdict": "block"'
      # The tarball that is published is this one, packed once and tested above.
      - name: Pack
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          sha512sum release/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Holds the right to publish: no checkout, no package manager, no dev
  # dependency; it only hands the verified tarball to npm.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: npm supports trusted publishing (11.5.1 or later)
        run: |
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)" ||
            { echo "npm $(npm --version) is too old for trusted publishing"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: release
      - name: The tarball is the tagged version
        run: |
          tgz="release/vola-trebla-croak-${GITHUB_REF_NAME#v}.tgz"
          [ -f "$tgz" ] && [ "$(find release -name '*.tgz' | wc -l)" -eq 1 ] || { ls -la release; echo "expected only $tgz"; exit 1; }
          sha512sum "$tgz"
      # No token: npm exchanges this job's OIDC token for a one-time publish
      # credential. --ignore-scripts: croak has no publish scripts, and none may run.
      - run: npm publish "release/vola-trebla-croak-${GITHUB_REF_NAME#v}.tgz" --provenance --access public --ignore-scripts
